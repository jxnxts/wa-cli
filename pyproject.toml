[project]
name = "wa-mac"
version = "0.1.0"
description = "CLI and MCP server (stdio) that let AI agents read WhatsApp Desktop on macOS and, with confirmation, send messages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonatas Soares" }]
keywords = ["whatsapp", "mcp", "macos", "cli", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp>=1.9,<2",
    "numpy>=2.4.6",
    "sounddevice>=0.5.6",
    "websockets>=17.4",
]

[project.optional-dependencies]
# Reading media: documents, images and OCR (macOS Vision). ffmpeg and mlx-whisper are found at run time.
media = [
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "Pillow>=11",
    "pyobjc-framework-Vision>=11; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/jxnxts/whatsapp-mac"
Repository = "https://github.com/jxnxts/whatsapp-mac"
Issues = "https://github.com/jxnxts/whatsapp-mac/issues"

[project.scripts]
wa = "wa.cli:main"
wa-mcp = "wa.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "wa-mac[media]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
